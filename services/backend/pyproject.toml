[project]
name = "agenda-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # long SQL constraint strings from autogenerate
